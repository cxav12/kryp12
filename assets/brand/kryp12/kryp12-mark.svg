<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 102">

<defs>
  <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0A56E8"/>
    <stop offset="55%" stop-color="#168BFF"/>
    <stop offset="100%" stop-color="#20B7FF"/>
  </linearGradient>
  <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#F4F5F7"/>
    <stop offset="75%" stop-color="#B8BDC5"/>
    <stop offset="100%" stop-color="#E8EAEE"/>
  </linearGradient>
  <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="65%" stop-color="#F8F8F8"/>
    <stop offset="100%" stop-color="#D6D8DC"/>
  </linearGradient>
  <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0C2F6F"/>
    <stop offset="55%" stop-color="#1C2638"/>
    <stop offset="100%" stop-color="#02060D"/>
