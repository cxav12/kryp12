<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Search Palworld items and find the Pals that drop or produce them."
    >
    <title>Palworld Reference | Items</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="../styles.css?v=20260825-redesign12">
    <link rel="stylesheet" href="./styles.css?v=20260825-redesign2">
  </head>
  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="brand-logo-frame" href="../" aria-label="Palworld reference">
          <img class="brand-logo" src="../assets/palworld-logo.png" alt="Palworld" width="2400" height="1500" decoding="async">
        </a>
      </div>
      <nav class="palworld-nav navbar" aria-label="Palworld navigation">
        <div class="nav-accent" aria-hidden="true"></div>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="palworld-nav-links"
          aria-label="Open navigation"
        >
          <span>Menu</span>
          <span class="nav-toggle-icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
        <ul id="palworld-nav-links" class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="../pals/">Pals</a></li>
          <li class="nav-item"><a class="nav-link" href="../passive-skills/">Passive Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="../breeding/">Breeding</a></li>
          <li class="nav-item"><a class="nav-link" href="../pal-calculator/">Pal Calculator</a></li>
          <li class="nav-item"><a class="nav-link" href="../ranch/">Ranch</a></li>
          <li class="nav-item"><a class="nav-link" href="../base-planner/">Base Planner</a></li>
          <li class="nav-item"><a class="nav-link" href="../party-guides/">Party Guides</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="./">Items</a></li>
          <li class="nav-item"><a class="nav-link" href="../type-chart/">Type Chart</a></li>
        </ul>
      </nav>
    </header>

    <main class="site-content">
      <section class="content-section" aria-labelledby="items-title">
        <div class="page-intro tinted-card">
          <div>
            <h1 id="items-title">Item Guide</h1>
            <p class="page-intro-copy">
              Search locally indexed items and see which Pals drop them in the
              wild or produce them at a Ranch.
            </p>
          </div>
        </div>

        <div class="site-toolbar items-toolbar">
          <div
            id="item-categories"
            class="filter-group"
            role="group"
            aria-label="Filter items by category"
          ></div>
          <div class="site-search" role="search">
            <label class="visually-hidden" for="item-search">Search items</label>
            <input
              id="item-search"
              class="form-control"
              type="search"
              placeholder="Search items or source Pals..."
              autocomplete="off"
            >
          </div>
        </div>

        <div id="items-grid" class="row g-2 g-xl-3" aria-live="polite">
          <p class="empty-state-message">Loading items...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <section id="items-status" class="data-status alert" data-state="current" role="status" hidden></section>
    </footer>

    <script src="../shared.js?v=20260727-passivepath1"></script>
    <script src="./app.js?v=20260727-tools1"></script>
  </body>
</html>
