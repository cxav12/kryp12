</defs>


  <!-- left stem -->
  <path d="M12 5 H31 V45 L12 65 Z" fill="url(#stemGrad)"/>
  <path d="M12 65 L31 45 V89 L12 97 Z" fill="url(#silverGrad)"/>

  <!-- upper blue arm -->
