<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Browse and filter Palworld passive skills by tier or name."
    >
    <title>Palworld Reference | Passive Skills</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../styles.css?v=20260826-controls1">
    <link rel="stylesheet" href="./styles.css?v=20260826-dropdowns5">
  </head>
  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="brand-logo-frame" href="../" aria-label="Palworld reference">
          <img
            class="brand-logo"
            src="../assets/palworld-logo.png"
            alt="Palworld"
            width="2400"
            height="1500"
            decoding="async"
          >
        </a>
      </div>

      <nav
        class="palworld-nav navbar"
        aria-label="Palworld navigation"
      >
        <div class="nav-accent" aria-hidden="true"></div>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="palworld-nav-links"
          aria-label="Open navigation"
        >
          <span>Menu</span>
          <span class="nav-toggle-icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
        <ul id="palworld-nav-links" class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="../pals/">
              Pals
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./">
              Passive Skills
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../breeding/">Breeding</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../pal-calculator/">Pal Calculator</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../ranch/">Ranch</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../base-planner/">Base Planner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../resources/">Resources</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="site-content">
      <section class="content-section" aria-labelledby="passive-skills-title">
        <div class="page-intro tinted-card">
          <div>
            <h1 id="passive-skills-title">Passive Skills</h1>
            <p class="page-intro-copy">
              Explore every passive skill and filter by type and tier to find
              the traits you want for combat, work, and breeding.
            </p>
          </div>
        </div>

        <div class="site-toolbar passive-toolbar">
          <label class="passive-filter-control" for="tier-filters">
            <select id="tier-filters" class="form-select" aria-label="Filter passive skills by tier">
              <option value="all">All Tiers</option>
              <option value="s">S-Tier</option>
              <option value="a">A-Tier</option>
              <option value="b">B-Tier</option>
              <option value="c">C-Tier</option>
              <option value="d">D-Tier</option>
              <option value="f">F-Tier</option>
            </select>
          </label>

          <label class="passive-filter-control" for="type-filters">
            <select id="type-filters" class="form-select" aria-label="Filter passive skills by type">
              <option value="all">All Types</option>
              <option value="player">Player Buffs</option>
              <option value="combat">Combat</option>
              <option value="work">Base &amp; Work</option>
              <option value="movement">Movement &amp; Mounts</option>
              <option value="elemental">Elemental</option>
              <option value="economy">Economy &amp; Loot</option>
            </select>
          </label>

          <div class="site-search" role="search">
            <label class="visually-hidden" for="passive-search-input">Search passive skills</label>
            <input
              id="passive-search-input"
              class="form-control"
              type="search"
              placeholder="Search passive skills..."
              autocomplete="off"
            >
          </div>
        </div>

        <div
          id="passive-skills-grid"
          class="row g-2 g-xl-3"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="empty-state-message">Loading passive skills...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <a class="footer-link" href="../">Home</a>
        <a class="footer-link" href="../legal-disclaimer/">Legal Disclaimer</a>
      </div>
    </footer>

    <script src="../shared.js?v=20260826-footer1"></script>
    <script src="../app.js?v=20260826-dropdowns1"></script>
  </body>
</html>
