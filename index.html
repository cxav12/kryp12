<!doctype html>
<html lang="en">
<head>

<body>

        <stop stop-color="#6f9abb" />
        <stop offset="1" stop-color="#719a7d" />

    </defs>
    <g stroke="url(#contour-trace)" stroke-width="1.25" stroke-linecap="round" stroke-dasharray="105 1100" stroke-dashoffset="1150">
      <path class="trace" d="M-120 840C300 740-80 470 250 360S380 70 790-60" />
      <path class="trace" d="M-90 900C370 730-10 470 290 390S430 80 850-40" />
      <path class="trace" d="M-60 950C400 770 20 510 340 420S490 90 910-20" />

  <main class="hub">
    <header class="hub-brand">
      <h1>KRYP12</h1>
      <p>Projects <span aria-hidden="true">•</span> Tools <span aria-hidden="true">•</span> Interests</p>
      <span class="brand-rule" aria-hidden="true"></span>
    </header>
    <!-- Add another list item to extend the grid. See LANDING.md. -->
    <ul class="project-grid" aria-label="Projects">
      <li>
        <a class="project-card project-card--yankees" href="/yankees/" aria-labelledby="yankees-title" aria-describedby="yankees-description">
          <div class="project-art" aria-hidden="true">
            <img class="project-logo yankees-logo" src="/yankees/assets/new-york-yankees.svg" alt="" width="500" height="500" decoding="async">
          </div>
          <div class="project-copy">
            <span class="project-category">Sports</span>
            <h2 id="yankees-title">New York Yankees</h2>
            <p id="yankees-description">Stats, games, standings and analysis.</p>
            <span class="project-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
          </div>
        </a>
      </li>
      <li>
        <a class="project-card project-card--palworld" href="/palworld/" aria-labelledby="palworld-title" aria-describedby="palworld-description">
          <div class="project-art" aria-hidden="true">
            <img class="project-logo palworld-logo" src="/palworld/assets/palworld-logo.png" alt="" width="2400" height="1500" decoding="async">
          </div>
          <div class="project-copy">
            <span class="project-category">Gaming</span>
            <h2 id="palworld-title">Palworld</h2>
            <p id="palworld-description">Guides, resources, builds and calculators.</p>
            <span class="project-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
          </div>
        </a>
      </li>
      <li>
        <a class="project-card project-card--wishlist" href="/wishlist/" aria-labelledby="wishlist-title" aria-describedby="wishlist-description">
          <div class="project-art" aria-hidden="true">
            <img class="project-logo wishlist-logo" src="/wishlist/assets/wishlist-logo.svg" alt="" width="96" height="96" decoding="async">
          </div>
          <div class="project-copy">
            <span class="project-category">Shopping</span>
            <h2 id="wishlist-title">Wishlist</h2>
            <p id="wishlist-description">Products and gift ideas from across the web.</p>
            <span class="project-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
          </div>
        </a>
      </li>
    </ul>
    <footer class="hub-footer"><span>KRYP12</span><span>A few interests. One place.</span></footer>
  </main>
  <script src="/assets/landing/landing.js?v=3" defer></script>
