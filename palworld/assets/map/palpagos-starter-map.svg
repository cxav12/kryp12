<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Palpagos starter map</title>
  <desc id="desc">A stylized local map canvas for starter Palworld points of interest.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09121d"/>
      <stop offset="0.55" stop-color="#071018"/>
      <stop offset="1" stop-color="#0b1624"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24392d"/>
      <stop offset="0.55" stop-color="#263326"/>
      <stop offset="1" stop-color="#363322"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f8ff"/>
      <stop offset="1" stop-color="#7d9faf"/>
    </linearGradient>
    <linearGradient id="volcano" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62311e"/>
      <stop offset="1" stop-color="#2a1612"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#ocean)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <g filter="url(#softShadow)">
    <path fill="url(#land)" stroke="#5f765e" stroke-width="5" d="M1003 318c72 5 133 55 158 120 32 83 8 168-44 229-41 49-30 131-96 171-63 38-132-8-190 36-43 33-55 96-121 99-60 3-89-48-135-75-67-39-150-10-202-65-48-51-44-130-74-193-34-70-105-111-101-189 5-88 88-139 160-168 62-25 126 0 190-9 82-11 147-72 228-54 73 16 132 92 227 98z"/>
    <path fill="url(#snow)" stroke="#c7edf6" stroke-width="4" d="M575 103c89-45 216-29 286 40 59 58 76 162 36 234-39 70-126 82-198 101-89 24-195 49-268-7-67-51-76-153-48-232 24-68 126-103 192-136z" opacity="0.9"/>
    <path fill="url(#volcano)" stroke="#b86f40" stroke-width="5" d="M93 705c62-117 225-145 328-66 83 64 102 186 49 277-57 99-183 142-285 90C67 945 32 819 93 705z"/>
    <path fill="#46572d" stroke="#788a4c" stroke-width="4" d="M1113 792c99-22 216 26 268 113 45 77 16 181-59 229-78 50-187 14-247-50-71-76-62-204 38-292z"/>
    <path fill="#344c3a" stroke="#6b846f" stroke-width="4" d="M1175 172c85-33 190 3 229 86 38 82-9 188-92 224-75 33-167-2-208-72-47-80-14-203 71-238z"/>
  </g>
  <path d="M812 506c67 35 119 90 158 156M588 563c72-31 150-41 230-30M406 749c85-74 176-113 289-130M1094 527c-47 83-48 171 3 263" fill="none" stroke="#edf4dc" stroke-opacity="0.18" stroke-width="12" stroke-linecap="round"/>
  <g fill="#fff" opacity="0.52" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800" letter-spacing="2">
    <text x="420" y="235">ASTRAL MOUNTAINS</text>
    <text x="160" y="810">VOLCANIC REGION</text>
    <text x="626" y="630">WINDSWEPT HILLS</text>
    <text x="1082" y="985">EASTERN WILDS</text>
    <text x="1120" y="325">SEA ROUTES</text>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="3">
    <path d="M1460 120l0 86M1417 163l86 0"/>
    <path d="M1460 120l18 43-18 43-18-43z" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  <text x="1424" y="237" fill="#fff" fill-opacity="0.55" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800">N</text>
</svg>
