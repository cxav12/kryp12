<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A Palworld reference page for browsing Pals, elements, work suitability, and stats."
    >
    <title>Palworld Reference | Pals</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../styles.css?v=20260725a">
  </head>
  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="brand-logo-frame" href="../" aria-label="Palworld Pals">
          <img
            class="brand-logo"
            src="../assets/palworld-logo.png"
            alt="Palworld"
          >
        </a>
      </div>

      <nav
        class="palworld-nav navbar navbar-expand"
        aria-label="Palworld navigation"
      >
        <div class="nav-accent" aria-hidden="true"></div>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./">
              Pals
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../passive-skills/">
              Passive Skills
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="site-content">
      <section class="pals-section" aria-label="Pals">
        <div class="pals-toolbar">
          <div
            id="pals-view-filters"
            class="tier-filters"
            role="group"
            aria-label="Choose Pal view"
          >
            <button
              class="tier-filter active"
              type="button"
              data-view="all"
              aria-pressed="true"
            >
              All
            </button>
            <button
              class="tier-filter"
              type="button"
              data-view="workers"
              aria-pressed="false"
            >
              Top Workers
            </button>
            <button
              class="tier-filter"
              type="button"
              data-view="elements"
              aria-pressed="false"
            >
              Element
            </button>
          </div>

          <div class="passive-search pal-search" role="search">
            <label class="visually-hidden" for="pal-search-input">
              Search Pals
            </label>
            <input
              id="pal-search-input"
              class="form-control"
              type="search"
              placeholder="Search Pals..."
              autocomplete="off"
            >
          </div>
        </div>

        <div
          id="work-filters"
          class="work-filters"
          role="group"
          aria-label="Rank Pals by work suitability"
          hidden
        ></div>

        <div id="element-filter-panel" class="element-filter-panel" hidden>
          <p class="filter-hint">
            Choose the primary element.
          </p>
          <div
            id="element-filters"
            class="element-filters"
            role="group"
            aria-label="Choose the primary element"
          ></div>

          <button
            id="second-element-toggle"
            class="tier-filter second-element-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="second-element-panel"
          >
            Add a 2nd Element
          </button>

          <div id="second-element-panel" class="second-element-panel" hidden>
            <p class="filter-hint">Choose the second element.</p>
            <div
              id="second-element-filters"
              class="element-filters"
              role="group"
              aria-label="Choose the second element"
            ></div>
          </div>
        </div>

        <div
          id="pals-grid"
          class="row g-2 g-xl-3"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="loading-message">Loading Pals...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <section
        id="data-status"
        class="data-status alert"
        role="status"
        aria-live="polite"
        hidden
      >
        <div>
          <strong id="data-status-title">Checking Pal data...</strong>
          <p id="data-status-message" class="mb-0"></p>
        </div>
        <div id="data-status-meta" class="data-status-meta"></div>
      </section>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./app.js?v=20260725c"></script>
  </body>
</html>
