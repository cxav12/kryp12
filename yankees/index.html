<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/yankees/assets/yankees-header-background.webp" type="image/webp" fetchpriority="high" />
    <base href="/yankees/" />
    <title>Yankees</title>
    <script>if (/^\d+$/.test(new URLSearchParams(location.search).get("game") || "")) location.replace("/yankees/game/" + location.search);</script>
    <link rel="preconnect" href="https://statsapi.mlb.com" />
    <link rel="preconnect" href="https://www.mlbstatic.com" />
    <link rel="preconnect" href="https://img.mlbstatic.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260928-canceled-spacing1" />
    <link rel="stylesheet" href="./offseason.css?v=20261019-inline-stats4" />
    <link rel="stylesheet" href="./shared.css?v=20261019-countdown1" />
  </head>
  <body>
    <main class="site-shell container-fluid">
      <section class="hero-panel position-relative overflow-hidden">
        <header class="topbar d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">
          <a class="brand-lockup d-flex align-items-center gap-3" href="./" aria-label="Yankees home" aria-current="page">
            <img class="brand-logo" src="./assets/new-york-yankees.svg" alt="New York Yankees logo" />
            <div>
              <h1 class="display-title brand-title mb-0">New York Yankees</h1>
            </div>
          </a>
        </header>

        <details class="site-nav">
          <summary><span>Menu</span><span class="site-nav-icon" aria-hidden="true"></span></summary>
          <nav class="site-nav-links" aria-label="Yankees sections">
            <a class="site-nav-link active" href="./" aria-current="page">Home</a>
            <a class="site-nav-link" href="./player-profile/">Player Profile</a>
            <a class="site-nav-link" href="./team-overview/">Team Overview</a>
            <a class="site-nav-link" href="./schedule/">Schedule</a>
            <a class="site-nav-link" href="./player-stats/">League Stats</a>
            <a class="site-nav-link" href="./around-the-league/">Around the League</a>
          </nav>
        </details>
        <nav class="desktop-site-nav navbar navbar-expand" aria-label="Yankees sections">
          <div class="navbar-nav">
            <a class="nav-link active" href="./" aria-current="page">Home</a>
            <a class="nav-link" href="./player-profile/">Player Profile</a>
            <a class="nav-link" href="./team-overview/">Team Overview</a>
            <a class="nav-link" href="./schedule/">Schedule</a>
            <a class="nav-link" href="./player-stats/">League Stats</a>
            <a class="nav-link" href="./around-the-league/">Around the League</a>
          </div>
        </nav>

      </section>

      <div id="home-view" aria-busy="true"><p class="offseason-empty">Loading Yankees home…</p></div>
      <template id="offseason-home-template">
      <section class="offseason-intro page-intro-card" aria-labelledby="offseason-title">
        <div><h2 class="page-heading" id="offseason-title">Offseason Hub</h2></div>
        <p class="offseason-updated" id="offseason-updated" role="status">Loading Yankees updates…</p>
      </section>
      <section class="offseason-panel offseason-dates-panel" aria-labelledby="dates-title">
        <header class="offseason-section-header"><div><h2 id="dates-title">Upcoming dates</h2><p>Confirmed Yankees schedule dates</p></div><a href="./schedule/">Full schedule ↗</a></header>
        <div class="offseason-dates" id="offseason-dates" aria-live="polite"><p class="offseason-empty">Loading dates…</p></div>
      </section>
      <div class="offseason-columns">
        <section class="offseason-panel offseason-moves" aria-labelledby="moves-title">
          <header class="offseason-section-header"><div><h2 id="moves-title">Offseason moves</h2><p id="moves-window">Recent roster activity</p></div><a href="./team-overview/">Team overview ↗</a></header>
          <div id="offseason-moves" aria-live="polite"><p class="offseason-empty">Loading transactions…</p></div>
        </section>
        <section class="offseason-panel" aria-labelledby="season-review-title">
          <header class="offseason-section-header"><div><h2 id="season-review-title">Season in review</h2><p id="season-review-label">Regular season</p></div></header>
          <div id="offseason-review" aria-live="polite"><p class="offseason-empty">Loading season totals…</p></div>
          <a class="offseason-more" href="./schedule/">Browse games and recaps ↗</a>
        </section>
      </div>
      <div class="offseason-columns">
        <section class="offseason-panel" aria-labelledby="news-title">
          <header class="offseason-section-header"><div><h2 id="news-title">Latest Yankees news</h2><p id="news-source">MLB.com</p></div><a href="https://www.mlb.com/yankees/news" target="_blank" rel="noopener noreferrer">All news ↗</a></header>
          <div id="offseason-news" aria-live="polite"><p class="offseason-empty">Loading headlines…</p></div>
        </section>
        <section class="offseason-panel" aria-labelledby="prospect-title">
          <header class="offseason-section-header"><div><h2 id="prospect-title">Prospect spotlight</h2></div><a href="./team-overview/#prospects">All prospects ↗</a></header>
          <div id="offseason-prospect" aria-live="polite"><p class="offseason-empty">Loading prospect…</p></div>
          <button class="offseason-next" type="button" id="next-prospect" hidden>Next prospect →</button>
        </section>
      </div>
      <section class="offseason-panel" aria-labelledby="roster-outlook-title">
        <header class="offseason-section-header"><div><h2 id="roster-outlook-title">Roster outlook</h2><p id="roster-outlook-label">Current 40-man roster, including injured-list entries</p></div><a href="./team-overview/">Full roster ↗</a></header>
        <div class="offseason-roster" id="offseason-roster" aria-live="polite"><p class="offseason-empty">Loading roster…</p></div>
      </section>
      </template>
      <template id="regular-home-template">
      <section class="recent-games-section" aria-label="Previous Yankees game recaps" hidden>
        <div class="recent-games-grid" id="recent-games-grid"></div>
      </section>

      <section class="selected-recap-section" aria-labelledby="game-page-title">
        <header class="page-intro-card page-intro-with-status">
          <div class="page-intro-copy">
            <h2 class="page-heading recap-visible-title" id="game-page-title">Game Center</h2>
            <p class="page-intro-description" id="game-page-description">Follow the selected Yankees matchup before, during, and after the game.</p>
          </div>
          <span class="status-pill page-intro-status" id="recap-status">Loading latest final</span>
        </header>
        <aside class="breaking-news" id="breaking-news" aria-labelledby="breaking-news-title" aria-live="polite" hidden>
          <header class="breaking-news-header">
            <div>
              <h2 id="breaking-news-title">Latest Transactions</h2>
            </div>
            <button class="breaking-news-close" id="breaking-news-close" type="button" aria-label="Dismiss Yankees alerts">×</button>
          </header>
          <div class="breaking-news-items" id="breaking-news-items"></div>
        </aside>
        <section class="recap-selector-section" aria-label="Recent results and upcoming Yankees games">
          <div class="recap-button-row" id="recap-button-row"></div>
        </section>
        <h2 class="visually-hidden" id="recap-title"></h2>
        <p class="visually-hidden" id="recap-subtitle"></p>
        <div class="last-game-card" id="recap-scoreboard" aria-live="polite"></div>
      </section>

      <header class="comparison-details-header recap-grid-heading" id="team-comparison-header"></header>
      <section class="game-details-container" aria-label="Game statistics and details">
        <section class="game-player-stats" id="game-player-stats" aria-label="Yankees player statistics for this game" aria-live="polite"></section>
        <section class="recap-section" aria-label="Latest Yankees game recap">
          <div class="recap-grid" id="recap-grid"></div>
        </section>
      </section>
      </template>
      <footer class="site-footer">
        <nav class="site-footer-links" aria-label="Footer">
          <a class="site-footer-link site-footer-item" href="/yankees/" aria-current="page">Home</a>
          <a class="site-footer-link site-footer-item" href="/yankees/legal-disclaimer/">Legal Disclaimer</a>
        </nav>
      </footer>
    </main>
    <script src="./assets/js/header-season.js?v=20261019-season-delay3" defer></script>
    <script src="./assets/js/shared.js?v=20261019-season-delay3" defer></script>
    <script src="./assets/js/home-view.js?v=20261019-sections3" defer></script>
  </body>
</html>
