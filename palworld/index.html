<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A Palworld reference site for passive skills, Pals, items, and more."
    >
    <title>Palworld Reference | Passive Skills</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./styles.css?v=20260724k">
  </head>
  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="brand-logo-frame" href="./" aria-label="Palworld Passive Skills">
          <img
            class="brand-logo"
            src="./assets/palworld-logo.png"
            alt="Palworld"
          >
        </a>
      </div>

      <nav
        class="palworld-nav navbar navbar-expand"
        aria-label="Palworld navigation"
      >
        <div class="nav-accent" aria-hidden="true"></div>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="./pals/">
              Pals
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./">
              Passive Skills
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="site-content">
      <section class="passive-skills-section" aria-label="Passive Skills">
        <div class="skills-toolbar">
          <div
            id="tier-filters"
            class="tier-filters"
            role="group"
            aria-label="Filter passive skills by tier"
          >
            <button class="tier-filter active" type="button" data-tier="all" aria-pressed="true">All</button>
            <button class="tier-filter" type="button" data-tier="s" aria-pressed="false">S-Tier</button>
            <button class="tier-filter" type="button" data-tier="a" aria-pressed="false">A-Tier</button>
            <button class="tier-filter" type="button" data-tier="b" aria-pressed="false">B-Tier</button>
            <button class="tier-filter" type="button" data-tier="c" aria-pressed="false">C-Tier</button>
            <button class="tier-filter" type="button" data-tier="d" aria-pressed="false">D-Tier</button>
            <button class="tier-filter" type="button" data-tier="f" aria-pressed="false">F-Tier</button>
          </div>

          <div class="passive-search" role="search">
            <label class="visually-hidden" for="passive-search-input">
              Search passive skills
            </label>
            <input
              id="passive-search-input"
              class="form-control"
              type="search"
              placeholder="Search passive skills..."
              autocomplete="off"
            >
          </div>
        </div>

        <div
          id="passive-skills-grid"
          class="row g-2 g-xl-3"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="loading-message">Loading passive skills…</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <section
        id="data-status"
        class="data-status alert"
        role="status"
        aria-live="polite"
        hidden
      >
        <div>
          <strong id="data-status-title">Checking game data…</strong>
          <p id="data-status-message" class="mb-0"></p>
        </div>
        <div id="data-status-meta" class="data-status-meta"></div>
      </section>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./app.js?v=20260724c"></script>
  </body>
</html>
